# =========================================================
# STAGING — GIỮ NGUYÊN
# =========================================================
deploy_staging:
  stage: deploy
  extends: .default_deploy

  tags:
    - safe-care-api-runner

  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

  variables:
    APP_DIR: "/var/www/safe-care-api-staging"
    APP_USER: "safe-care-api-staging"
    PM2_APP_NAME: "safe-care-api-staging"

  script:
    - 'echo "=== [1/5] Giai đoạn: Sync code ==="'
    - 'rsync -rv --delete --exclude=".git" --exclude="node_modules" --exclude="public" --exclude="secrets" --exclude=".env" $CI_PROJECT_DIR/ $APP_DIR/'
    - 'echo "=== Hoàn thành Sync code ==="'

    - 'echo "=== [2/5] Giai đoạn: Cài đặt dependencies ==="'
    - 'cd $APP_DIR'
    - 'npm ci'
    - 'echo "=== Hoàn thành cài đặt dependencies ==="'

    - 'echo "=== [3/5] Giai đoạn: Đồng bộ Database ==="'
    - 'npm run db:prod:sync'
    - 'echo "=== Hoàn thành đồng bộ Database ==="'

    - 'echo "=== [4/5] Giai đoạn: Build backend ==="'
    - 'npm run build'
    - 'echo "=== Hoàn thành Build backend ==="'

    - 'echo "=== [5/5] Giai đoạn: Restart PM2 ==="'
    - 'sudo -u $APP_USER pm2 restart $PM2_APP_NAME --update-env || sudo -u $APP_USER pm2 start npm --name $PM2_APP_NAME -- run start:prod'
    - 'echo "=== Hoàn thành Restart PM2 - Pipeline hoàn tất thành công ==="'